what version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: agni_netra_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agninetra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agni_netra_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
